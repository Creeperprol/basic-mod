name: auto-bump

# Bumps the plugin's patch version and tags it whenever mod code changes on main.
on:
  push:
    branches: [main]
    paths:
      - 'session-link/hooks/**'
      - 'session-link/types/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bump patch version
        run: |
          file='session-link/.claude-plugin/plugin.json'
          # A push that already edits the version (a manual bump) is left alone.
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1 HEAD | grep -qx "$file"; then
            echo "version already changed in this push; skipping"
            exit 0
          fi
          old=$(sed -n 's/.*"version": "\([0-9.]*\)".*/\1/p' "$file" | head -1)
          new=$(echo "$old" | awk -F. '{print $1"."$2"."$3+1}')
          sed -i "s/\"version\": \"$old\"/\"version\": \"$new\"/" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "Bump to $new [skip ci]"
          git tag "v$new"
          git push origin main "v$new"
